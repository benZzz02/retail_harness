[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "refundpilot-harness"
version = "0.3.0"
description = "A minimal agent harness over the external tau-bench Retail environment"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
refundpilot = "refundpilot.cli:main"

[tool.setuptools.packages.find]
include = ["refundpilot*"]

[tool.setuptools.package-data]
refundpilot = ["data/*.json"]
